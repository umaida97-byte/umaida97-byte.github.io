{% assign c = site.data.company %}<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "RealEstateAgent",
  "@id": "{{ site.url }}/#organisation",
  "name": "{{ c.name }}",
  "legalName": "{{ c.legal_name }}",
  "url": "{{ site.url }}/",
  "logo": "{{ site.url }}/assets/images/logo-mark.png",
  "image": "{{ site.url }}/assets/images/og-default.jpg",
  "description": "Independent, family-run letting agent and property management company in Stoke-on-Trent. Letting property locally since {{ c.letting_since }}; managing over {{ c.portfolio.properties }} properties for over {{ c.portfolio.landlords }} landlords.",
  "foundingDate": "{{ c.incorporated }}",
  "telephone": "{{ c.phone_link }}",
  "email": "{{ c.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ c.address.street }}",
    "addressLocality": "{{ c.address.town }}",
    "addressRegion": "{{ c.address.county }}",
    "postalCode": "{{ c.address.postcode }}",
    "addressCountry": "GB"
  },
  "areaServed": [
    {"@type": "City", "name": "Stoke-on-Trent"},
    {"@type": "Place", "name": "Newcastle-under-Lyme"},
    {"@type": "AdministrativeArea", "name": "Staffordshire"}
  ],
  "openingHoursSpecification": [
    {"@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "08:30", "closes": "17:30"},
    {"@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "10:00", "closes": "16:00"}
  ],
  "memberOf": [
    {"@type": "Organization", "name": "National Residential Landlords Association"},
    {"@type": "Organization", "name": "Property Redress Scheme"},
    {"@type": "Organization", "name": "Money Shield"}
  ],
  "sameAs": ["{{ c.google_profile }}"]
}
</script>
